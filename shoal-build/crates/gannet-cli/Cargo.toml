[package]
name = "gannet-cli"
description = "Gannet command-line interface: local dev environment, health checks, and config management"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "gannet_cli"
path = "src/lib.rs"

[[bin]]
name = "gannet"
path = "src/main.rs"

[dependencies]
gannet-server = { path = "../gannet-server" }
clap = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
