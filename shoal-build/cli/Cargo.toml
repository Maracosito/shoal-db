[package]
name = "lakefin-cli"
version = "0.5.0"
edition = "2021"
description = "Command-line interface for Lakefin, the object-storage-native vector + full-text search database"
license = "Apache-2.0"
repository = "https://github.com/lakefin/lakefin"

# Standalone crate: builds independently of the server workspace so the CLI
# can be installed with `cargo install --path cli` without pulling engine deps.
[workspace]

[[bin]]
name = "lakefin"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
indicatif = "0.17"
comfy-table = "7"
hdrhistogram = "7"
rand = "0.8"
futures = "0.3"
