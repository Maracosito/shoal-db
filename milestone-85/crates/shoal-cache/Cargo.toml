[package]
name = "shoal-cache"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Two-tier (in-memory + local disk) cache layer for Shoal, the object-storage-native search database"

[dependencies]
bytes = "1"
hex = "0.4"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "macros"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync"] }
