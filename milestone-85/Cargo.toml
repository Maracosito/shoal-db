[workspace]
resolver = "2"
members = [
    "crates/shoal-core",
    "crates/shoal-cache",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/shoal-db/shoal"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
thiserror = "1"
async-trait = "0.1"
futures = "0.3"
object_store = { version = "0.11", features = ["aws"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
crc32fast = "1"
lru = "0.12"
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
