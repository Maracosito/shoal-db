apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "shoal.fullname" . }}-config
  labels:
    {{- include "shoal.labels" . | nindent 4 }}
data:
  SHOAL_LISTEN_ADDR: "0.0.0.0:8080"
  SHOAL_STORAGE_BACKEND: "s3"
  SHOAL_S3_ENDPOINT: {{ .Values.config.s3.endpoint | quote }}
  SHOAL_S3_BUCKET: {{ .Values.config.s3.bucket | quote }}
  SHOAL_S3_REGION: {{ .Values.config.s3.region | quote }}
  SHOAL_S3_FORCE_PATH_STYLE: {{ .Values.config.s3.forcePathStyle | quote }}
  SHOAL_CACHE_DIR: {{ .Values.config.cache.dir | quote }}
  SHOAL_CACHE_DISK_BYTES: {{ .Values.config.cache.diskBytes | quote }}
  SHOAL_CACHE_MEMORY_BYTES: {{ .Values.config.cache.memoryBytes | quote }}
  SHOAL_LOG: {{ .Values.config.logLevel | quote }}
