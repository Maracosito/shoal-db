apiVersion: v1
kind: ConfigMap
metadata:
  name: shoal-config
  namespace: shoal
  labels:
    app.kubernetes.io/name: shoal
data:
  SHOAL_LISTEN_ADDR: "0.0.0.0:8080"
  SHOAL_STORAGE_BACKEND: "s3"
  # Leave SHOAL_S3_ENDPOINT empty for AWS S3; set it for MinIO/other
  # S3-compatible stores (e.g. http://minio.minio.svc:9000).
  SHOAL_S3_ENDPOINT: ""
  SHOAL_S3_BUCKET: "shoal"
  SHOAL_S3_REGION: "us-east-1"
  SHOAL_S3_FORCE_PATH_STYLE: "false"
  SHOAL_CACHE_DIR: "/var/cache/shoal"
  SHOAL_CACHE_DISK_BYTES: "17179869184"   # 16 GiB; keep below the cache volume sizeLimit
  SHOAL_CACHE_MEMORY_BYTES: "2147483648"  # 2 GiB
  SHOAL_LOG: "info"
