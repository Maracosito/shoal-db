version: 2
updates:
  # Rust workspace (server crates + CLI).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      rust-deps:
        patterns: ["*"]

  # Python SDK.
  - package-ecosystem: pip
    directory: "/sdks/python"
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]

  # TypeScript SDK.
  - package-ecosystem: npm
    directory: "/sdks/typescript"
    schedule:
      interval: weekly
    groups:
      ts-sdk-deps:
        patterns: ["*"]

  # TypeScript e2e harness.
  - package-ecosystem: npm
    directory: "/e2e/typescript"
    schedule:
      interval: weekly
    groups:
      ts-e2e-deps:
        patterns: ["*"]

  # GitHub Actions used by CI / e2e / release workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Server Docker image base layers.
  - package-ecosystem: docker
    directory: "/deploy/docker"
    schedule:
      interval: weekly
