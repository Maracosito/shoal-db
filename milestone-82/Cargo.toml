[workspace]
resolver = "2"
members = [
    "crates/gannet-core",
    "crates/gannet-format",
    "crates/gannet-server",
    "crates/gannet-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/gannet-db/gannet"
authors = ["Gannet contributors"]
rust-version = "1.78"

[workspace.dependencies]
# Internal crates
gannet-core = { path = "crates/gannet-core" }
gannet-format = { path = "crates/gannet-format" }
gannet-server = { path = "crates/gannet-server" }

# Third-party
anyhow = "1"
assert_cmd = "2"
async-trait = "0.1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
axum = "0.7"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
object_store = "0.11"
once_cell = "1"
parking_lot = "0.12"
predicates = "3"
prometheus = "0.13"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 1
